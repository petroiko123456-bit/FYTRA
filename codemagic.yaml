workflows:
  android-workflow:
    name: FYTRA Android Build
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Main2
          include: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Copy web assets
        script: cp index.html www/index.html
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
